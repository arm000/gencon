name            = "gencon-ai-proxy"
main            = "index.js"
compatibility_date = "2024-09-23"
workers_dev     = true

[[d1_databases]]
binding  = "DB"
database_name = "gencon-watches"
database_id   = "7d93bbdc-d39f-415c-b4bd-9fc4468af044"

[triggers]
crons = ["0 */2 * * *"]

# Secrets to set after deploying:
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put RESEND_API_KEY
#   npx wrangler secret put RESEND_FROM_EMAIL   (e.g. "GenCon Watch <you@yourdomain.com>")
