name            = "gencon-ai-proxy"
main            = "index.js"
compatibility_date = "2024-09-23"
workers_dev     = true

[[d1_databases]]
binding  = "DB"
database_name = "gencon-watches"
database_id   = "REPLACE_WITH_DATABASE_ID"

[triggers]
crons = ["0 */2 * * *"]

# Secrets to set after deploying:
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put RESEND_API_KEY
#   npx wrangler secret put RESEND_FROM_EMAIL   (e.g. "GenCon Watch <you@yourdomain.com>")
#   npx wrangler secret put TWILIO_ACCOUNT_SID
#   npx wrangler secret put TWILIO_AUTH_TOKEN
#   npx wrangler secret put TWILIO_FROM_NUMBER  (E.164 format, e.g. +15551234567)
