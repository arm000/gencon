<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GenCon 2026 – Search Events</title>
  <script src="v.js"></script>
  <script>document.write('<link rel="stylesheet" href="style.css?v='+V+'">');</script>
</head>
<body>

<header>
  <a class="logo" href="index.html">GenCon 2026</a>
  <nav>
    <a href="index.html" class="active">Search</a>
    <a href="schedule.html">My Schedule</a>
  </nav>
  <span class="header-right" id="header-count"></span>
</header>

<main>
  <div class="card">
    <!-- Search bar -->
    <div class="search-bar">
      <input type="text" id="q" placeholder="Search events…" autocomplete="off">
    </div>

    <!-- Filters -->
    <div class="filters">
      <label>Type
        <select id="f-type">
          <option value="">All types</option>
        </select>
      </label>
      <label>Day/Time
        <select id="f-day">
          <option value="">Any day</option>
          <optgroup label="Thu, Jul 30"><option value="Thu">All day</option><option value="Thu-morning">Morning (before noon)</option><option value="Thu-afternoon">Afternoon (noon–6 PM)</option><option value="Thu-evening">Evening (6 PM+)</option></optgroup>
          <optgroup label="Fri, Jul 31"><option value="Fri">All day</option><option value="Fri-morning">Morning</option><option value="Fri-afternoon">Afternoon</option><option value="Fri-evening">Evening</option></optgroup>
          <optgroup label="Sat, Aug 1"><option value="Sat">All day</option><option value="Sat-morning">Morning</option><option value="Sat-afternoon">Afternoon</option><option value="Sat-evening">Evening</option></optgroup>
          <optgroup label="Sun, Aug 2"><option value="Sun">All day</option><option value="Sun-morning">Morning</option><option value="Sun-afternoon">Afternoon</option><option value="Sun-evening">Evening</option></optgroup>
        </select>
      </label>
      <label>Duration (h)
        <div class="filter-group">
          <input type="number" id="f-min-dur" placeholder="min" min="0" step="0.5" style="width:64px">
          <input type="number" id="f-max-dur" placeholder="max" min="0" step="0.5" style="width:64px">
        </div>
      </label>
      <label>Min tickets
        <input type="number" id="f-tickets" placeholder="0" min="0" style="width:64px">
      </label>
      <label class="filter-checkbox">
        <input type="checkbox" id="f-hide-soldout">
        Hide sold out
      </label>
      <label class="filter-checkbox">
        <input type="checkbox" id="f-hide-conflicts">
        Hide conflicts
      </label>
      <button class="btn btn-secondary btn-sm" id="btn-clear-filters">Clear</button>
      <button class="btn btn-secondary btn-sm" id="btn-save-search">Save Search</button>
    </div>

    <!-- Saved searches panel (hidden until at least one exists) -->
    <div id="watches-panel" class="watches-panel" style="display:none">
      <div class="watches-header">
        <span class="watches-title">Saved Searches</span>
        <button class="btn btn-secondary btn-sm" id="btn-notif-settings">Notifications…</button>
      </div>
      <div id="watches-list"></div>
    </div>

    <div class="results-meta" id="results-meta"></div>

    <div class="event-table-wrap">
      <div id="results-loading" class="loading-msg">
        <div class="loading-spinner"></div><br>Loading events…
      </div>
      <table class="event-table" id="results-table" style="display:none">
        <thead>
          <tr>
            <th class="col-time sortable" data-sort="time">Time</th>
            <th class="col-title sortable" data-sort="title">Title</th>
            <th class="col-type sortable" data-sort="type">Type</th>
            <th class="col-system sortable" data-sort="system">System</th>
            <th class="col-avail sortable" data-sort="avail">Avail</th>
            <th class="col-cost sortable" data-sort="cost">Cost</th>
            <th class="col-conflict"></th>
            <th class="col-action"></th>
          </tr>
        </thead>
        <tbody id="results-body"></tbody>
      </table>
    </div>

    <div class="load-more-wrap" id="load-more-wrap" style="display:none">
      <button class="btn btn-secondary" id="btn-load-more">Show more</button>
    </div>
  </div>
</main>

<!-- Detail Modal -->
<div class="modal-overlay" id="detail-modal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="detail-title">
    <div class="modal-header">
      <h2 id="detail-title"></h2>
      <button class="modal-close" id="detail-close" aria-label="Close">×</button>
    </div>
    <div class="modal-body">
      <div id="detail-conflict-alert" style="display:none" class="conflict-alert"></div>
      <div class="detail-grid" id="detail-grid"></div>
      <div class="detail-desc" id="detail-desc"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-primary" id="detail-add">Add to Schedule</button>
      <button class="btn btn-secondary" id="detail-alts">Find Alternatives</button>
      <button class="btn btn-secondary" id="detail-close2">Close</button>
    </div>
  </div>
</div>

<!-- Alternatives Modal -->
<div class="modal-overlay" id="alts-modal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="alts-title">
    <div class="modal-header">
      <h2 id="alts-title"></h2>
      <button class="modal-close" id="alts-close" aria-label="Close">×</button>
    </div>
    <div class="modal-body" id="alts-body"></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="alts-close2">Close</button>
    </div>
  </div>
</div>

<!-- Conflict confirmation modal -->
<div class="modal-overlay" id="conflict-modal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="conflict-title">
    <div class="modal-header">
      <h2 id="conflict-title">Schedule Conflict</h2>
      <button class="modal-close" id="conflict-close" aria-label="Close">×</button>
    </div>
    <div class="modal-body" id="conflict-body"></div>
    <div class="modal-footer">
      <button class="btn btn-primary" id="conflict-add-anyway">Add Anyway</button>
      <button class="btn btn-secondary" id="conflict-cancel">Cancel</button>
    </div>
  </div>
</div>

<!-- Save Search Modal -->
<div class="modal-overlay" id="save-search-modal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="save-search-title">
    <div class="modal-header">
      <h2 id="save-search-title">Save Search</h2>
      <button class="modal-close" id="save-search-close" aria-label="Close">×</button>
    </div>
    <div class="modal-body">
      <div class="sync-form">
        <label class="sync-field">Name
          <input type="text" id="save-search-name" placeholder="e.g. Friday evening RPGs" autocomplete="off">
        </label>
        <div id="save-search-preview" class="watch-filter-summary"></div>
      </div>
      <div id="save-search-status" style="display:none"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-primary" id="save-search-submit">Save</button>
      <button class="btn btn-secondary" id="save-search-cancel">Cancel</button>
    </div>
  </div>
</div>

<!-- Notification Settings Modal -->
<div class="modal-overlay" id="notif-settings-modal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="notif-settings-title">
    <div class="modal-header">
      <h2 id="notif-settings-title">Notification Settings</h2>
      <button class="modal-close" id="notif-settings-close" aria-label="Close">×</button>
    </div>
    <div class="modal-body">
      <div class="sync-form">
        <label class="sync-field">Email address
          <input type="email" id="notif-email" placeholder="you@example.com" autocomplete="email">
        </label>
        <label class="sync-field">Phone number (for SMS)
          <input type="tel" id="notif-phone" placeholder="+15551234567" autocomplete="tel">
        </label>
        <label class="filter-checkbox sync-remember">
          <input type="checkbox" id="notif-email-on" checked> Send email notifications
        </label>
        <label class="filter-checkbox sync-remember">
          <input type="checkbox" id="notif-sms-on" checked> Send SMS notifications
        </label>
      </div>
      <div id="notif-settings-status" style="display:none"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-primary" id="notif-settings-save">Save</button>
      <button class="btn btn-secondary" id="notif-settings-cancel">Cancel</button>
    </div>
  </div>
</div>

<div id="toast"></div>
<footer><span class="version-label"></span></footer>

<script>document.write('<script src="app.js?v='+V+'"><\/script>');</script>
<script>
// ── Page state ─────────────────────────────────────────────
let filteredEvents = [];
let displayedCount = 0;
let detailEventId  = null;
let sortCol        = null;  // active sort column key, or null
let sortDir        = 1;     // 1 = asc, -1 = desc

// ── Watches (saved searches) ─────────────────────────────────
const WATCHES_CACHE_KEY = 'gencon-watches-cache';

async function loadWatches() {
  try {
    const resp = await fetch(`${AI_WORKER_URL}/watches`);
    if (!resp.ok) throw new Error(resp.status);
    const watches = await resp.json();
    localStorage.setItem(WATCHES_CACHE_KEY, JSON.stringify(watches));
    renderWatches(watches);
  } catch {
    // Fall back to cache so the panel still shows up offline
    const cached = localStorage.getItem(WATCHES_CACHE_KEY);
    if (cached) renderWatches(JSON.parse(cached));
  }
}

function renderWatches(watches) {
  const panel = document.getElementById('watches-panel');
  const list  = document.getElementById('watches-list');
  if (!watches.length) { panel.style.display = 'none'; return; }
  panel.style.display = '';
  list.innerHTML = watches.map(w => `
    <div class="watch-row" data-id="${esc(w.id)}">
      <span class="watch-name">${esc(w.name)}</span>
      <span class="watch-filter-summary">${esc(filterSummary(JSON.parse(w.filters)))}</span>
      <button class="btn btn-secondary btn-sm btn-watch-apply" data-filters="${esc(w.filters)}">Apply</button>
      <button class="btn btn-secondary btn-sm btn-watch-delete" data-id="${esc(w.id)}">✕</button>
    </div>`).join('');
}

function filterSummary(f) {
  const parts = [];
  if (f.query)     parts.push(`"${f.query}"`);
  if (f.type)      parts.push(`Type: ${f.type}`);
  if (f.day)       parts.push(`Day: ${f.day}`);
  if (f.minDur)    parts.push(`≥${f.minDur}h`);
  if (f.maxDur)    parts.push(`≤${f.maxDur}h`);
  if (f.minTickets > 0) parts.push(`≥${f.minTickets} tickets`);
  return parts.join(' · ') || 'All events';
}

async function deleteWatch(id) {
  try {
    await fetch(`${AI_WORKER_URL}/watches/${encodeURIComponent(id)}`, { method: 'DELETE' });
  } catch { /* best-effort */ }
  const cached = JSON.parse(localStorage.getItem(WATCHES_CACHE_KEY) || '[]').filter(w => w.id !== id);
  localStorage.setItem(WATCHES_CACHE_KEY, JSON.stringify(cached));
  renderWatches(cached);
}

function applyWatch(filtersJson) {
  const f = JSON.parse(filtersJson);
  document.getElementById('q').value             = f.query      || '';
  document.getElementById('f-type').value        = f.type       || '';
  document.getElementById('f-day').value         = f.day        || '';
  document.getElementById('f-min-dur').value     = f.minDur     || '';
  document.getElementById('f-max-dur').value     = f.maxDur     || '';
  document.getElementById('f-tickets').value     = f.minTickets || '';
  document.getElementById('f-hide-soldout').checked   = false;
  document.getElementById('f-hide-conflicts').checked = false;
  runSearch();
}

// ── Save Search modal ────────────────────────────────────────
function openSaveSearchModal() {
  const filters = getFilters();
  // Strip hideConflicts from saved filter — schedule changes over time
  const { hideConflicts: _, ...saveFilters } = filters;
  document.getElementById('save-search-name').value = '';
  document.getElementById('save-search-preview').textContent = filterSummary(saveFilters);
  document.getElementById('save-search-status').style.display = 'none';
  document.getElementById('save-search-modal').classList.add('open');
  document.getElementById('save-search-modal')._filters = saveFilters;
  document.getElementById('save-search-name').focus();
}

async function doSaveSearch() {
  const name    = document.getElementById('save-search-name').value.trim();
  const filters = document.getElementById('save-search-modal')._filters;
  if (!name) { setSaveStatus('Please enter a name.', 'err'); return; }

  document.getElementById('save-search-submit').disabled = true;
  setSaveStatus('Saving…');

  try {
    const resp = await fetch(`${AI_WORKER_URL}/watches`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, filters }),
    });
    const data = await resp.json();
    if (data.error) throw new Error(data.error);

    // Update cache
    const cached = JSON.parse(localStorage.getItem(WATCHES_CACHE_KEY) || '[]');
    cached.unshift(data);
    localStorage.setItem(WATCHES_CACHE_KEY, JSON.stringify(cached));
    renderWatches(cached);

    closeModal('save-search-modal');
    showToast(`Saved search: ${name}`);
  } catch (err) {
    setSaveStatus(err.message, 'err');
  } finally {
    document.getElementById('save-search-submit').disabled = false;
  }
}

function setSaveStatus(msg, type) {
  const el = document.getElementById('save-search-status');
  el.style.display = '';
  el.className = `sync-status${type === 'err' ? ' sync-status-err' : ''}`;
  el.textContent = msg;
}

// ── Notification Settings modal ──────────────────────────────
async function openNotifSettings() {
  document.getElementById('notif-settings-status').style.display = 'none';
  try {
    const resp = await fetch(`${AI_WORKER_URL}/prefs`);
    if (resp.ok) {
      const p = await resp.json();
      document.getElementById('notif-email').value      = p.email    || '';
      document.getElementById('notif-phone').value      = p.phone    || '';
      document.getElementById('notif-email-on').checked = p.email_on !== false;
      document.getElementById('notif-sms-on').checked   = p.sms_on   !== false;
    }
  } catch { /* leave defaults */ }
  document.getElementById('notif-settings-modal').classList.add('open');
}

async function doSaveNotifSettings() {
  const prefs = {
    email:    document.getElementById('notif-email').value.trim(),
    phone:    document.getElementById('notif-phone').value.trim(),
    email_on: document.getElementById('notif-email-on').checked ? '1' : '0',
    sms_on:   document.getElementById('notif-sms-on').checked   ? '1' : '0',
  };
  document.getElementById('notif-settings-save').disabled = true;
  try {
    const resp = await fetch(`${AI_WORKER_URL}/prefs`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(prefs),
    });
    const data = await resp.json();
    if (data.error) throw new Error(data.error);
    closeModal('notif-settings-modal');
    showToast('Notification settings saved');
  } catch (err) {
    const el = document.getElementById('notif-settings-status');
    el.style.display = '';
    el.className = 'sync-status sync-status-err';
    el.textContent = err.message;
  } finally {
    document.getElementById('notif-settings-save').disabled = false;
  }
}

// ── Boot ────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', async () => {
  try {
    await initApp();
  } catch (err) {
    document.getElementById('results-loading').innerHTML =
      `<p style="color:var(--danger-text)">Failed to load events.json.<br><small>${err.message}</small><br>` +
      `<small>Run <code>python scripts/build_events_json.py</code> first, then serve from the <code>docs/</code> folder.</small></p>`;
    return;
  }
  document.getElementById('results-loading').style.display = 'none';
  document.getElementById('results-table').style.display   = '';
  populateTypeFilter();
  updateHeaderCount();
  runSearch();
  loadWatches();
  bindEvents();
});

// ── Filters ──────────────────────────────────────────────────
function getFilters() {
  const minTickets  = parseInt(document.getElementById('f-tickets').value, 10) || 0;
  const hideSoldOut = document.getElementById('f-hide-soldout').checked;
  return {
    query:         document.getElementById('q').value,
    type:          document.getElementById('f-type').value,
    day:           document.getElementById('f-day').value,
    minDur:        parseFloat(document.getElementById('f-min-dur').value) || 0,
    maxDur:        parseFloat(document.getElementById('f-max-dur').value) || 0,
    minTickets:    hideSoldOut ? Math.max(minTickets, 1) : minTickets,
    hideConflicts: document.getElementById('f-hide-conflicts').checked,
  };
}

function populateTypeFilter() {
  const sel = document.getElementById('f-type');
  for (const t of allTypes()) {
    const opt = document.createElement('option');
    opt.value       = t.split(' - ')[0];
    opt.textContent = t;
    sel.appendChild(opt);
  }
}

// ── Sort ─────────────────────────────────────────────────────
function applySort() {
  if (!sortCol) return;
  filteredEvents.sort((a, b) => {
    let cmp = 0;
    switch (sortCol) {
      case 'time': {
        const sa = parseTime(a.start), sb = parseTime(b.start);
        cmp = (sa && sb) ? sa - sb : 0;
        break;
      }
      case 'title':  cmp = (a.title  || '').localeCompare(b.title  || ''); break;
      case 'type':   cmp = (a.type   || '').localeCompare(b.type   || ''); break;
      case 'system': cmp = (a.system || '').localeCompare(b.system || ''); break;
      case 'avail':  cmp = (a.ticketsAvailable || 0) - (b.ticketsAvailable || 0); break;
      case 'cost':   cmp = (a.cost   || 0) - (b.cost   || 0); break;
    }
    return cmp * sortDir;
  });
}

function updateSortHeaders() {
  for (const th of document.querySelectorAll('#results-table thead th[data-sort]')) {
    if (!th.dataset.label) th.dataset.label = th.textContent.trim();
    const active = th.dataset.sort === sortCol;
    th.textContent = th.dataset.label + (active ? (sortDir === 1 ? ' ▲' : ' ▼') : '');
    th.classList.toggle('sort-active', active);
  }
}

// ── Search & render ──────────────────────────────────────────
function runSearch() {
  const filters = getFilters();
  filteredEvents = searchEvents(filters);
  if (filters.hideConflicts) {
    const scheduled = getScheduledEvents();
    filteredEvents = filteredEvents.filter(ev =>
      isScheduled(ev.id) || findConflicts(ev, scheduled).length === 0
    );
  }
  applySort();
  displayedCount = 0;
  renderPage();
}

function renderPage() {
  const total  = filteredEvents.length;
  const toShow = filteredEvents.slice(0, displayedCount + PAGE_SIZE);
  displayedCount = toShow.length;

  const meta = document.getElementById('results-meta');
  meta.textContent = total === 0 ? 'No events found.' :
    `${total.toLocaleString()} event${total === 1 ? '' : 's'} found` +
    (displayedCount < total ? ` — showing ${displayedCount}` : '');

  const tbody = document.getElementById('results-body');
  tbody.innerHTML = '';
  for (const ev of toShow) tbody.appendChild(makeRow(ev));

  const lmw = document.getElementById('load-more-wrap');
  lmw.style.display = displayedCount < total ? '' : 'none';
}

function makeRow(ev) {
  const tr      = document.createElement('tr');
  const inSched = isScheduled(ev.id);
  const cfls    = inSched ? [] : findConflicts(ev, getScheduledEvents());
  const hasConflict = cfls.length > 0;
  if (hasConflict) tr.classList.add('row-conflict');
  const conflictTip = hasConflict
    ? cfls.map(c => `${c.title} (${fmtSlot(c)})`).join('; ')
    : '';
  tr.innerHTML = `
    <td class="col-time">${fmtSlot(ev)}</td>
    <td class="col-title" data-id="${esc(ev.id)}">${esc(ev.title)}</td>
    <td class="col-type"><span class="type-badge">${esc(shortType(ev.type))}</span></td>
    <td class="col-system">${esc(ev.system || '')}</td>
    <td class="col-avail">${fmtAvail(ev.ticketsAvailable)}</td>
    <td class="col-cost">${fmtCost(ev.cost)}</td>
    <td class="col-conflict">${hasConflict ? `<span class="conflict-badge" title="${esc(conflictTip)}">⚠ conflict</span>` : ''}</td>
    <td class="col-action">
      ${inSched
        ? `<button class="btn btn-success btn-sm" disabled>✓ Scheduled</button>`
        : `<button class="btn btn-primary btn-sm btn-add" data-id="${esc(ev.id)}">+ Add</button>`}
      <button class="btn btn-secondary btn-sm btn-info" data-id="${esc(ev.id)}" title="Details">⋯</button>
    </td>`;
  return tr;
}

// ── Update header count ──────────────────────────────────────
function updateHeaderCount() {
  const n = getIds().length;
  document.getElementById('header-count').textContent =
    n ? `${n} event${n === 1 ? '' : 's'} in schedule` : '';
}

// ── Detail modal ─────────────────────────────────────────────
function openDetail(id) {
  detailEventId = id;
  const ev = EVENT_INDEX[id];
  if (!ev) return;

  document.getElementById('detail-title').textContent = ev.title;

  const grid = document.getElementById('detail-grid');
  const rows = [
    ['Game ID',      ev.id],
    ['Time',         fmtSlot(ev)],
    ['Duration',     ev.duration ? `${ev.duration}h` : ''],
    ['Type',         ev.type],
    ['System',       ev.system],
    ['Rules',        ev.rulesEdition],
    ['Players',      ev.minPlayers && ev.maxPlayers ? `${ev.minPlayers}–${ev.maxPlayers}` : ''],
    ['Age',          ev.ageRequired],
    ['Experience',   ev.experienceRequired],
    ['GM',           ev.gmNames],
    ['Location',     [ev.location, ev.roomName, ev.tableNumber ? `Table ${ev.tableNumber}` : ''].filter(Boolean).join(' · ')],
    ['Cost',         fmtCost(ev.cost)],
    ['Tickets',      String(ev.ticketsAvailable)],
    ['Tournament',   ev.tournament ? 'Yes' : 'No'],
    ['Category',     ev.specialCategory && ev.specialCategory !== 'none' ? ev.specialCategory : ''],
    ['Group',        ev.group],
  ].filter(([, v]) => v);

  grid.innerHTML = rows.map(([k, v]) =>
    `<span class="label">${esc(k)}</span><span class="value">${esc(v)}</span>`
  ).join('');

  document.getElementById('detail-desc').innerHTML = [
    ev.shortDesc ? `<p><strong>Summary:</strong> ${esc(ev.shortDesc)}</p>` : '',
    ev.longDesc  ? `<p>${esc(ev.longDesc)}</p>` : '',
  ].join('');

  // Refresh add button state
  refreshDetailAddBtn();
  refreshDetailConflictAlert();

  document.getElementById('detail-modal').classList.add('open');
}

function refreshDetailAddBtn() {
  const btn = document.getElementById('detail-add');
  if (isScheduled(detailEventId)) {
    btn.textContent = '✓ Scheduled';
    btn.disabled    = true;
    btn.className   = 'btn btn-success';
  } else {
    btn.textContent = 'Add to Schedule';
    btn.disabled    = false;
    btn.className   = 'btn btn-primary';
  }
}

function refreshDetailConflictAlert() {
  const alert = document.getElementById('detail-conflict-alert');
  if (isScheduled(detailEventId)) { alert.style.display = 'none'; return; }
  const ev      = EVENT_INDEX[detailEventId];
  const cfls    = findConflicts(ev, getScheduledEvents());
  if (!cfls.length) { alert.style.display = 'none'; return; }
  alert.style.display = '';
  alert.innerHTML = `<strong>Conflict:</strong> Overlaps with scheduled event${cfls.length > 1 ? 's' : ''}:
    <ul>${cfls.map(c => `<li>${esc(c.title)} — ${fmtSlot(c)}</li>`).join('')}</ul>`;
}

// ── Alternatives modal ────────────────────────────────────────
function openAlternatives(id) {
  const ev   = EVENT_INDEX[id];
  const alts = getAlternatives(id);
  document.getElementById('alts-title').textContent = `All timeslots: ${ev.title}`;

  const body = document.getElementById('alts-body');
  if (!alts.length) {
    body.innerHTML = '<p class="empty-msg">No alternative timeslots found.</p>';
  } else {
    body.innerHTML = alts.map(a => {
      const statusLabel = a._inSchedule ? '✓ In your schedule'
        : a._conflicts.length ? `Conflicts: ${a._conflicts.map(c => esc(c.title)).join(', ')}`
        : 'Free';
      const statusCls = `alt-status ${a._status}`;
      const addBtn    = (!a._inSchedule && a._status === 'free')
        ? `<button class="btn btn-primary btn-sm btn-alt-add" data-id="${esc(a.id)}">+ Add</button>`
        : '';
      return `<div class="alt-row">
        <span class="alt-slot">${fmtSlot(a)}</span>
        <span class="alt-avail">${fmtAvail(a.ticketsAvailable)}</span>
        <span class="${statusCls}">${statusLabel}</span>
        ${addBtn}
      </div>`;
    }).join('');
  }
  document.getElementById('alts-modal').classList.add('open');
}

// ── Conflict confirmation ─────────────────────────────────────
let pendingAddId   = null;
let pendingAddCfls = [];

function promptConflict(id, conflicts) {
  pendingAddId   = id;
  pendingAddCfls = conflicts;
  const ev = EVENT_INDEX[id];
  document.getElementById('conflict-body').innerHTML =
    `<p>Adding <strong>${esc(ev.title)}</strong> (${fmtSlot(ev)}) overlaps with:</p>
     <ul>${conflicts.map(c => `<li>${esc(c.title)} — ${fmtSlot(c)}</li>`).join('')}</ul>
     <p>Add it to your schedule anyway?</p>`;
  document.getElementById('conflict-modal').classList.add('open');
}

// ── Handle add ────────────────────────────────────────────────
function handleAdd(id, fromConflictModal = false) {
  const result = addEvent(id, fromConflictModal);
  if (result.status === 'already') {
    showToast('Already in your schedule', 'warn');
  } else if (result.status === 'conflict') {
    promptConflict(id, result.conflicts);
  } else if (result.status === 'ok') {
    const ev = EVENT_INDEX[id];
    const msg = result.conflicts.length ? `Added (with conflict): ${ev.title}` : `Added: ${ev.title}`;
    showToast(msg, result.conflicts.length ? 'warn' : 'ok');
    // Refresh rows + header
    rerenderRow(id);
    updateHeaderCount();
    if (detailEventId === id) { refreshDetailAddBtn(); refreshDetailConflictAlert(); }
  }
}

function rerenderRow(id) {
  const trs = document.querySelectorAll('#results-body tr');
  for (const tr of trs) {
    const titleCell = tr.querySelector('.col-title');
    if (titleCell && titleCell.dataset.id === id) {
      const newTr = makeRow(EVENT_INDEX[id]);
      tr.replaceWith(newTr);
      bindRowEvents(newTr);
      return;
    }
  }
}

// ── Event binding ─────────────────────────────────────────────
let searchTimer = null;

function bindEvents() {
  // Search inputs
  for (const id of ['q', 'f-type', 'f-day', 'f-min-dur', 'f-max-dur', 'f-tickets']) {
    document.getElementById(id).addEventListener('input', () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(runSearch, id === 'q' ? 300 : 0);
    });
  }
  document.getElementById('f-hide-soldout').addEventListener('change', runSearch);
  document.getElementById('f-hide-conflicts').addEventListener('change', runSearch);

  // Clear filters
  document.getElementById('btn-clear-filters').addEventListener('click', () => {
    document.getElementById('q').value                  = '';
    document.getElementById('f-type').value             = '';
    document.getElementById('f-day').value              = '';
    document.getElementById('f-min-dur').value          = '';
    document.getElementById('f-max-dur').value          = '';
    document.getElementById('f-tickets').value          = '';
    document.getElementById('f-hide-soldout').checked   = false;
    document.getElementById('f-hide-conflicts').checked = false;
    runSearch();
  });

  // Load more
  document.getElementById('btn-load-more').addEventListener('click', renderPage);

  // Column sort
  document.querySelector('#results-table thead').addEventListener('click', e => {
    const th = e.target.closest('th[data-sort]');
    if (!th) return;
    const col = th.dataset.sort;
    if (sortCol === col) {
      sortDir *= -1;
    } else {
      sortCol = col;
      sortDir = 1;
    }
    updateSortHeaders();
    applySort();
    displayedCount = 0;
    renderPage();
  });

  // Results table delegation
  document.getElementById('results-body').addEventListener('click', e => {
    const addBtn  = e.target.closest('.btn-add');
    const infoBtn = e.target.closest('.btn-info');
    const titleEl = e.target.closest('.col-title');
    if (addBtn)  handleAdd(addBtn.dataset.id);
    if (infoBtn) openDetail(infoBtn.dataset.id);
    if (titleEl) openDetail(titleEl.dataset.id);
  });

  // Detail modal
  document.getElementById('detail-close').addEventListener('click',  () => closeModal('detail-modal'));
  document.getElementById('detail-close2').addEventListener('click', () => closeModal('detail-modal'));
  document.getElementById('detail-add').addEventListener('click',    () => handleAdd(detailEventId));
  document.getElementById('detail-alts').addEventListener('click',   () => {
    closeModal('detail-modal');
    openAlternatives(detailEventId);
  });

  // Alternatives modal
  document.getElementById('alts-close').addEventListener('click',  () => closeModal('alts-modal'));
  document.getElementById('alts-close2').addEventListener('click', () => closeModal('alts-modal'));
  document.getElementById('alts-body').addEventListener('click', e => {
    const btn = e.target.closest('.btn-alt-add');
    if (btn) handleAdd(btn.dataset.id);
  });

  // Conflict modal
  document.getElementById('conflict-close').addEventListener('click',  () => closeModal('conflict-modal'));
  document.getElementById('conflict-cancel').addEventListener('click', () => closeModal('conflict-modal'));
  document.getElementById('conflict-add-anyway').addEventListener('click', () => {
    closeModal('conflict-modal');
    if (pendingAddId) handleAdd(pendingAddId, true);
  });

  // Save Search button
  document.getElementById('btn-save-search').addEventListener('click', openSaveSearchModal);
  document.getElementById('save-search-close').addEventListener('click',  () => closeModal('save-search-modal'));
  document.getElementById('save-search-cancel').addEventListener('click', () => closeModal('save-search-modal'));
  document.getElementById('save-search-submit').addEventListener('click', doSaveSearch);
  document.getElementById('save-search-name').addEventListener('keydown', e => {
    if (e.key === 'Enter') doSaveSearch();
  });

  // Notification settings
  document.getElementById('btn-notif-settings').addEventListener('click', openNotifSettings);
  document.getElementById('notif-settings-close').addEventListener('click',  () => closeModal('notif-settings-modal'));
  document.getElementById('notif-settings-cancel').addEventListener('click', () => closeModal('notif-settings-modal'));
  document.getElementById('notif-settings-save').addEventListener('click', doSaveNotifSettings);

  // Saved searches list (delegated)
  document.getElementById('watches-list').addEventListener('click', e => {
    const applyBtn  = e.target.closest('.btn-watch-apply');
    const deleteBtn = e.target.closest('.btn-watch-delete');
    if (applyBtn)  applyWatch(applyBtn.dataset.filters);
    if (deleteBtn) deleteWatch(deleteBtn.dataset.id);
  });

  // Close modals on overlay click
  for (const id of ['detail-modal', 'alts-modal', 'conflict-modal', 'save-search-modal', 'notif-settings-modal']) {
    document.getElementById(id).addEventListener('click', e => {
      if (e.target === document.getElementById(id)) closeModal(id);
    });
  }

  // Close on Escape
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      for (const id of ['conflict-modal', 'alts-modal', 'detail-modal', 'save-search-modal', 'notif-settings-modal']) {
        if (document.getElementById(id).classList.contains('open')) {
          closeModal(id);
          break;
        }
      }
    }
  });
}

function bindRowEvents(tr) {
  // Rows added via rerenderRow already get picked up by delegation — no-op needed.
}

function closeModal(id) {
  document.getElementById(id).classList.remove('open');
}

// ── Escape helper ─────────────────────────────────────────────
function esc(str) {
  return String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
